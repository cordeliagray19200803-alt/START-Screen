<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>個人情報の取扱い</title><link rel="stylesheet" href="styles.css"></head><body><header class="app-header compact"><a class="back-link" href="index.html">‹</a><div><h1>個人情報の取扱い</h1></div></header><main class="container"><section class="card"><h2>端末内保存</h2><p>入力内容は、オフライン利用のためこの端末のブラウザ内に保存されます。共用端末では利用しないでください。</p><h2>クラウド保存</h2><p>クラウド機能を設定して利用する場合、医療情報はSupabase Edge Functionで暗号化して保存されます。公開用URLを知っている人は、NFCから救急表示用情報を閲覧できます。</p><h2>重要事項</h2><p>本アプリは診断や治療判断を行いません。緊急時は119番通報や医療機関の指示を優先してください。</p></section></main></body></html>
